name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything lives in the reusable build workflow, shared with release.yml. CI falls back to a
  # stable server build (with a warning) if the pinned nightly dist build breaks.
  build:
    uses: ./.github/workflows/build.yml
    with:
      strict: false
