[package]
name = "dsh-env-server"
version = "0.2.0"
edition = "2024"
description = "Remote environment server for the DeepSeek Harness environments plugin"
license = "MIT"
repository = "https://github.com/std-microblock/dsh-plugin-environments"

[dependencies]
anyhow = "1"
getrandom = "0.3"
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
regex-lite = "0.1"
serde_json = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "io-std", "process", "time", "sync", "macros", "fs"] }
portable-pty = "0.9"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
